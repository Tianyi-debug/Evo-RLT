[build-system]
requires = ["setuptools>=71", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-rlt"
version = "0.1.0"
description = "Evo-RLT: RL Token wrapper and LeRobot integration for real-world robot RL"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
lerobot = [
    "lerobot[pi,smolvla] @ https://github.com/huggingface/lerobot/archive/refs/tags/v0.5.1.tar.gz",
    "safetensors>=0.4.3",
    "packaging>=24.0",
    "evdev>=1.7",
    "feetech-servo-sdk>=1.0.0",
]
test = ["pytest>=8.1", "pytest-timeout>=2.4"]
dev = ["evo-rlt[lerobot,test]", "ruff>=0.6"]

[project.scripts]
evo-rlt-build-transition-cache = "evo_rlt.cli.build_transition_cache:main"
evo-rlt-build-bucket-cache = "evo_rlt.cli.build_bucket_cache:main"
evo-rlt-build-transition-cache-v2 = "evo_rlt.cli.build_transition_cache_v2:main"
evo-rlt-compute-token-variance = "evo_rlt.cli.compute_token_variance:main"
evo-rlt-prepare-mix-buckets = "evo_rlt.cli.prepare_mix_buckets:main"
evo-rlt-rescale-cache-reward = "evo_rlt.cli.rescale_cache_reward:main"
evo-rlt-recompute-dataset-stats = "evo_rlt.cli.recompute_dataset_stats:main"
evo-rlt-compare-camera-pose = "evo_rlt.cli.compare_camera_pose:main"
evo-rlt-audit-dynamic-beta = "evo_rlt.cli.audit_dynamic_beta:main"
evo-rlt-aggregate-datasets = "evo_rlt.cli.aggregate_datasets:main"
evo-rlt-build-actor-trust-dataset = "evo_rlt.cli.build_actor_trust_dataset:main"
evo-rlt-train-corrective-risk = "evo_rlt.cli.train_corrective_risk:main"
evo-rlt-audit-risk-action-dependence = "evo_rlt.cli.audit_risk_action_dependence:main"
evo-rlt-audit-actor-q-mechanism = "evo_rlt.cli.audit_actor_q_mechanism:main"
evo-rlt-audit-critic-mechanism = "evo_rlt.cli.audit_critic_mechanism:main"
evo-rlt-audit-critic-progress-action = "evo_rlt.cli.audit_critic_progress_action:main"
evo-rlt-audit-critic-actionability = "evo_rlt.cli.audit_critic_actionability:main"
evo-rlt-train-actor-critic = "evo_rlt.cli.train_chunk_actor_critic:main"
evo-rlt-train-rl-token = "evo_rlt.cli.train_rl_token:main"
evo-rlt-collect-default = "evo_rlt.adapters.lerobot.record.cli:collect_default_main"
evo-rlt-record = "evo_rlt.adapters.lerobot.record.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evo_rlt = ["core/configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110
